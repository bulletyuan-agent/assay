<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Assay mascot: a gold nugget with a magnifying glass">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="0.55" stop-color="#F7B731"/><stop offset="1" stop-color="#E08E0B"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF7FF" stop-opacity=".95"/><stop offset="1" stop-color="#BFE3F5" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <ellipse cx="124" cy="226" rx="70" ry="12" fill="#1F1A14" opacity=".12"/>
  <!-- nugget body -->
  <path d="M60 120 C54 84 84 52 124 50 C168 48 200 78 198 120 C196 164 176 212 126 214 C82 216 64 168 60 120 Z" fill="url(#g)" stroke="#1F1A14" stroke-width="7" stroke-linejoin="round"/>
  <!-- facets -->
  <path d="M92 74 C104 66 118 64 132 66" fill="none" stroke="#FFF3C4" stroke-width="7" stroke-linecap="round"/>
  <path d="M82 96 L90 90" stroke="#FFF3C4" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 196 C166 190 178 172 182 150" fill="none" stroke="#C97A06" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- eyes -->
  <ellipse cx="104" cy="128" rx="11" ry="14" fill="#1F1A14"/><ellipse cx="148" cy="128" rx="11" ry="14" fill="#1F1A14"/>
  <circle cx="108" cy="123" r="4" fill="#fff"/><circle cx="152" cy="123" r="4" fill="#fff"/>
  <!-- cheeks + mouth -->
  <ellipse cx="88" cy="152" rx="9" ry="6" fill="#FF8A65" opacity=".55"/><ellipse cx="166" cy="152" rx="9" ry="6" fill="#FF8A65" opacity=".55"/>
  <path d="M114 154 Q126 166 138 154" fill="none" stroke="#1F1A14" stroke-width="6" stroke-linecap="round"/>
  <!-- little arms -->
  <path d="M62 150 C48 156 44 172 54 182" fill="none" stroke="#1F1A14" stroke-width="7" stroke-linecap="round"/>
  <!-- magnifier -->
  <g transform="translate(48 46) scale(.82) rotate(-18 190 150)">
    <rect x="186" y="156" width="14" height="64" rx="7" fill="#7A4B22" stroke="#1F1A14" stroke-width="6"/>
    <circle cx="193" cy="120" r="40" fill="url(#lens)" stroke="#1F1A14" stroke-width="8"/>
    <path d="M168 104 Q176 88 194 86" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <path d="M178 122 L190 134 L212 106" fill="none" stroke="#2E9E5B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
